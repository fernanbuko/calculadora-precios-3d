name: Revisar pedidos pendientes y enviar notificaciones

on:
  schedule:
    # Cada 30 minutos. GitHub Actions usa hora UTC, pero esto no afecta el
    # resultado: el script calcula la hora de Ecuador por su cuenta.
    #
    # Aviso honesto: GitHub NO garantiza que se ejecute exactamente al
    # minuto — en momentos de mucha carga en sus servidores (poco común,
    # pero puede pasar) a veces se retrasa unos minutos más.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite ejecutarlo a mano desde la pestaña Actions, para probar

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install firebase-admin
        working-directory: notificaciones-robot

      - name: Ejecutar la revisión de pedidos
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node revisar-pedidos.js
        working-directory: notificaciones-robot
